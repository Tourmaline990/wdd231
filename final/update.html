    <main>
      <h1 class="intro">Updates</h1>
       <form method="get" action="thankyou.html">
        <fieldset class="first">
        <legend>Personal Information </legend>
         <label>First Name*<input type="text" title="First Name" required name="fname" autocomplete="given-name"></label>
         <label>Last Name* <input type="text" title="Last Name" required name="lname" autocomplete="family-name" ></label>
         <label>Email* <input type="email" title="email" required name="email" autocomplete="email" placeholder="Someone@gmail.com"></label>
         <label>Country* <input type="text" title="Location" required name="country" placeholder="Nigeria"></label>
         </fieldset>
         <fieldset class="second">
          <legend>What Intrigued You</legend>
          <label><input type="checkbox" name="intrigue" value="Astronomy" title="Astronomy" >Astronomy Image</label>
          <label><input type="checkbox" name="intrigue" value="Satelite" title="Satelite">Space Phenomena</label>
          <label><input type="checkbox" name="intrigue" value="Earth" title="Land Changes">Earth Observation</label>
          <label><input type="checkbox" name="intrigue" value="volcanoe" title="Volcanoes">Volcanoes and Wildfire</label>
          <label><input type="checkbox" name="intrigue" value="Natural Events" title="Storms">Natural Events</label>
         </fieldset>
         <fieldset class="third">
          <legend>Updates Preference</legend>
          <label><input type="radio" required name="newsletter" value="dailydigest" title="Daily Digest">Major Events Only</label>
          <label><input type="radio" required name="newsletter" value="weekly" title="Weekly Summary">Weekly Summary</label>
          <label><input type="radio" required name="newsletter" value="special alerts" title="Special Alerts">Monthly Highlights</label>
         </fieldset>
         <label class="fourth"><input type="checkbox" required name="consent" value="yes">I agree to recieve emails and understand my data will be handled safely</label>
         <fieldset> 
          <legend>Share Your Thoughts</legend>
          <textarea name="thoughts" placeholder="Any Feauture You'd love to see?"></textarea>
         </fieldset>
         <input type="date" hidden name="date">
         <input type="submit" value="Subscribe">
       </form>
         
    </main>
